# Git hooks for every commit. `task setup` installs them once per clone; run them on
# every file with `python -m pre_commit run --all-files`.
# Hook repositories are pinned to the commit of a release tag, named in the comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(ps1|psm1|psd1)$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: prettier
        name: prettier
        entry: node frontend/node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        files: ^frontend/
        exclude: ^frontend/(dist|bindings|node_modules)/|^frontend/package-lock\.json$
